name: Build and Release

on:
  push:
    tags:
      - 'v*' # Se activa cuando creas un tag como v2.0.0
  workflow_dispatch: # Permite ejecución manual desde la web para pruebas

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install RPM tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Native Installer
        run: |
          mvn clean package -Pnative-installer -DskipTests
          if [ "${{ runner.os }}" == "Linux" ]; then
            # Generar también el RPM manualmente
            jpackage --type rpm --input target/app-jar --dest target/installer --name SAFBuilder --main-jar safbuilder.jar --main-class safbuilder.cli.BatchProcess --app-version 2.0.0 --vendor HernanLagos
          fi
        shell: bash

      - name: Prepare Artifacts (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          # Buscar .dmg (Mac) o .deb y .rpm (Linux)
          find target/installer -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -exec cp {} dist/ \;
          # Crear portable zip
          mvn package -Pnative-app-image -DskipTests
          cd target/installer
          zip -r ../../dist/SAFBuilder-${{ runner.os }}-Portable.zip SAFBuilder*
        shell: bash

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\installer\*.msi dist\
          # Crear portable zip
          mvn package -Pnative-app-image -DskipTests
          Compress-Archive -Path target\installer\SAFBuilder -DestinationPath dist\SAFBuilder-Windows-Portable.zip
        shell: pwsh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
