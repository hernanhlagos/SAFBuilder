name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set APP_VERSION from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: x64
          cache: 'maven'

      - name: Build Windows Installer
        shell: pwsh
        run: |
          mvn clean package -Pnative-installer "-DskipTests" "-Dapp.version=$env:APP_VERSION"

      - name: Prepare Installer Artifact
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Remove-Item dist -Recurse -Force
          }

          New-Item -ItemType Directory -Path dist | Out-Null

          Get-ChildItem target/installer -Include *.exe, *.msi -Recurse |
            Copy-Item -Destination dist

          Write-Host "Installers prepared:"
          Get-ChildItem dist

      - name: Verify only installer files
        shell: pwsh
        run: |
          $invalid = Get-ChildItem dist -Recurse | Where-Object {
            $_.Extension -notin ".exe", ".msi"
          }

          if ($invalid) {
            Write-Host "Invalid files detected:"
            $invalid
            exit 1
          }

      - name: Upload Installer for Inspection
        uses: actions/upload-artifact@v4
        with:
          name: SAFBuilder-Windows-Installer
          path: dist/*
          if-no-files-found: error

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
