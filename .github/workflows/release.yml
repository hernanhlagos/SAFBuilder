name: Build and Release

on:
  push:
    tags:
      - 'v*' # Se activa cuando creas un tag como v2.0.0
  workflow_dispatch: # Permite ejecución manual desde la web para pruebas

permissions:
  contents: write # Necesario para crear el Release y subir archivos

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # --- macOS Platforms ---
          - os: macos-15-intel
            architecture: x64
            name: macOS Intel
            platform-suffix: Intel
          - os: macos-latest
            architecture: aarch64
            name: macOS Apple Silicon
            platform-suffix: AppleSilicon

          # --- Linux Platforms (descomentar cuando sea necesario) ---
          - os: ubuntu-latest
            architecture: x64
            name: Linux x64
            platform-suffix: Linux

          # --- Windows Platforms (descomentar cuando sea necesario) ---
          - os: windows-latest
            architecture: x64
            name: Windows x64
            platform-suffix: Windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ !env.ACT || runner.os != 'macOS' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          architecture: ${{ matrix.architecture }}
          cache: 'maven'

      - name: Install RPM tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Native Installer
        run: |
          mvn clean package -Pnative-installer -DskipTests
          if [ "${{ runner.os }}" == "Linux" ]; then
            # Generar también el RPM manualmente
            $JAVA_HOME/bin/jpackage --type rpm --input target/app-jar --dest target/installer --name SAFBuilder --main-jar safbuilder.jar --main-class safbuilder.cli.BatchProcess --app-version 2.0.0 --vendor HernanLagos
          fi
        shell: bash

      - name: Prepare Artifacts (Linux/Mac)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          # Copiar instaladores nativos (.dmg en Mac, .deb y .rpm en Linux)
          find target/installer \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist/ \;

          # Renombrar archivos de Mac para incluir arquitectura (Intel / AppleSilicon)
          if [ "${{ runner.os }}" == "macOS" ]; then
            for f in dist/*.dmg; do mv "$f" "${f%.dmg}-${{ matrix.platform-suffix }}.dmg"; done
          fi
        shell: bash

      - name: Prepare Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path dist)) { mkdir dist }
          # Copiar instaladores nativos (.msi y .exe)
          Get-ChildItem target/installer/*.msi, target/installer/*.exe | Copy-Item -Destination dist/
        shell: pwsh

      - name: Upload Artifacts for Inspection
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SAFBuilder-${{ matrix.platform-suffix }}-Binaries
          path: dist/*

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
